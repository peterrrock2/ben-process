repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-merge-conflict
  - repo: local
    hooks:
      # Formats only the staged .rs files, in place. If rustfmt rewrites a file the commit aborts so
      # you can review and re-stage the result. rustfmt discovers rustfmt.toml automatically.
      - id: rustfmt
        name: rustfmt (staged files)
        entry: rustfmt --edition 2021
        language: system
        types: [rust]
      # clippy compiles the whole crate, so it can't be scoped to individual files; it runs once per
      # commit that touches Rust.
      - id: clippy
        name: clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        pass_filenames: false
        types: [rust]
